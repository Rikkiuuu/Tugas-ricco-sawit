<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WA Screenshot Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0d1117;
    --surface:  #161b22;
    --surface2: #1c2128;
    --border:   rgba(255,255,255,0.08);
    --border2:  rgba(255,255,255,0.12);
    --text:     #e6edf3;
    --muted:    #7d8590;
    --accent:   #00a884;
    --accent2:  #00cf9f;
    --danger:   #e53935;
    --radius:   12px;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
  }
  .logo {
    width: 36px; height: 36px;
    background: var(--accent);
    border-radius: 10px;
    display: flex; align-items:center; justify-content:center;
  }
  .logo svg { width:20px; height:20px; color:#fff; }
  header h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
  header span { font-size: 13px; color: var(--muted); margin-left: auto; }

  /* ── Layout ── */
  .layout {
    display: grid;
    grid-template-columns: 420px 1fr;
    flex: 1;
    min-height: 0;
  }

  /* ── Form Panel ── */
  .panel {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ── Mode Toggle ── */
  .mode-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: var(--surface2);
    border-radius: var(--radius);
    padding: 4px;
    gap: 4px;
  }
  .mode-btn {
    padding: 9px 0;
    border: none; background: transparent; cursor: pointer;
    border-radius: 9px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13.5px; font-weight: 500;
    color: var(--muted);
    display: flex; align-items:center; justify-content:center; gap: 6px;
    transition: all 0.15s;
  }
  .mode-btn.active { background: var(--accent); color: #fff; }
  .mode-btn svg { width:14px; height:14px; }

  /* ── Section ── */
  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .section-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ── Field ── */
  .field { display:flex; flex-direction:column; gap:5px; }
  .field label { font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .field input, .field textarea, .field select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    padding: 9px 12px;
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }
  .field input:focus, .field textarea:focus, .field select:focus {
    border-color: var(--accent);
  }
  .field textarea { resize: vertical; min-height: 72px; line-height: 1.5; }
  .field select option { background: var(--surface2); }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* ── Avatar row ── */
  .avatar-row { display:flex; align-items:center; gap:10px; }
  .avatar-preview {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink:0;
    background: var(--accent);
    display:flex; align-items:center; justify-content:center;
    font-size:17px; font-weight:600; color:#fff;
    overflow:hidden; position:relative;
  }
  .avatar-preview img {
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  }

  /* ── Menu items editor ── */
  .menu-list { display:flex; flex-direction:column; gap:6px; }
  .menu-item-row {
    display: grid;
    grid-template-columns: 1fr 110px 32px;
    gap: 6px;
    align-items: center;
  }
  .menu-item-row input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13.5px;
    padding: 7px 10px;
    outline: none;
    width: 100%;
  }
  .menu-item-row input:focus { border-color: var(--accent); }
  .icon-select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 12.5px;
    padding: 7px 6px;
    outline: none;
    width: 100%;
  }
  .icon-select:focus { border-color: var(--accent); }
  .btn-remove {
    width:32px; height:32px; border-radius:8px;
    background: rgba(229,57,53,0.1); border:1px solid rgba(229,57,53,0.2);
    color: var(--danger); cursor:pointer; font-size:16px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; transition: background 0.15s;
  }
  .btn-remove:hover { background: rgba(229,57,53,0.2); }
  .btn-add-item {
    padding: 7px 14px;
    background: rgba(0,168,132,0.08);
    border: 1px dashed rgba(0,168,132,0.3);
    border-radius: 8px;
    color: var(--accent);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .btn-add-item:hover { background: rgba(0,168,132,0.15); }

  /* ── Toggle ── */
  .toggle-row {
    display: flex; align-items:center; justify-content:space-between;
  }
  .toggle-label { font-size: 13.5px; }
  .toggle {
    width:42px; height:24px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 100px;
    position: relative; cursor: pointer;
    transition: background 0.2s;
  }
  .toggle.on { background: var(--accent); border-color: var(--accent); }
  .toggle-knob {
    position: absolute;
    top: 2px; left: 2px;
    width: 18px; height: 18px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.2s;
  }
  .toggle.on .toggle-knob { transform: translateX(18px); }

  /* ── Reactions ── */
  .re-input {
    font-family: 'DM Mono', monospace;
    font-size: 18px;
    letter-spacing: 2px;
  }

  /* ── Generate button ── */
  .btn-generate {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    border: none; border-radius: var(--radius);
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 600;
    cursor: pointer;
    display: flex; align-items:center; justify-content:center; gap:8px;
    transition: all 0.15s;
    letter-spacing: -0.2px;
  }
  .btn-generate:hover { background: var(--accent2); }
  .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-generate svg { width:18px; height:18px; }

  /* ── Preview Panel ── */
  .preview-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 40px 24px;
    gap: 20px;
    overflow-y: auto;
    background: repeating-conic-gradient(var(--surface) 0% 25%, var(--bg) 0% 50%) 0 0 / 24px 24px;
  }

  .preview-box {
    position: relative;
  }
  .preview-img {
    display: block;
    border-radius: 16px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.7);
    max-width: 390px;
    width: 100%;
  }

  .preview-placeholder {
    width: 390px;
    height: 400px;
    background: var(--surface);
    border: 2px dashed var(--border2);
    border-radius: 20px;
    display: flex; flex-direction:column;
    align-items:center; justify-content:center; gap:12px;
    color: var(--muted);
  }
  .preview-placeholder svg { width:40px; height:40px; opacity:0.4; }
  .preview-placeholder p { font-size:14px; }

  .preview-actions {
    display: flex; gap: 10px;
  }
  .btn-dl {
    padding: 9px 20px;
    border-radius: 8px;
    border: none; cursor: pointer;
    font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500;
    display:flex; align-items:center; gap:6px;
    transition: all 0.15s;
  }
  .btn-dl-png {
    background: var(--accent); color: #fff;
  }
  .btn-dl-png:hover { background: var(--accent2); }
  .btn-dl-copy {
    background: var(--surface2); color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-dl-copy:hover { border-color: var(--border2); }
  .btn-dl svg { width:15px; height:15px; }

  /* ── Loading ── */
  .loading {
    display: none;
    position: absolute; inset:0;
    background: rgba(0,0,0,0.6);
    border-radius: 20px;
    align-items:center; justify-content:center;
  }
  .loading.show { display:flex; }
  .spinner {
    width:36px; height:36px;
    border:3px solid rgba(255,255,255,0.15);
    border-top-color: var(--accent);
    border-radius:50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Error ── */
  .error-msg {
    display:none;
    background: rgba(229,57,53,0.1);
    border: 1px solid rgba(229,57,53,0.3);
    border-radius: 10px;
    padding: 12px 16px;
    color: #ef9a9a;
    font-size: 13.5px;
    width: 100%;
    max-width: 390px;
  }
  .error-msg.show { display:block; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  </div>
  <h1>WA Screenshot Generator</h1>
  <span>pixel-perfect clone</span>
</header>

<div class="layout">

  <!-- ── Form ── -->
  <div class="panel" id="panel">

    <!-- Mode -->
    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="iphone" onclick="setMode('iphone')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="1" width="14" height="22" rx="3"/><line x1="12" y1="18" x2="12.01" y2="18" stroke-width="2.5"/></svg>
        iPhone
      </button>
      <button class="mode-btn" data-mode="android" onclick="setMode('android')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 16a7 7 0 0 1 14 0"/><line x1="12" y1="16" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/></svg>
        Android
      </button>
    </div>

    <!-- Profile -->
    <div class="section">
      <div class="section-title">👤 Profil Kontak</div>
      <div class="avatar-row">
        <div class="avatar-preview" id="avatarPreview">
          <span id="avatarInitialDisplay">C</span>
          <img id="avatarImgEl" src="" alt="" style="display:none">
        </div>
        <div style="flex:1; display:flex; flex-direction:column; gap:8px">
          <input type="text" id="contactName" placeholder="Nama kontak" value="Askar" oninput="updateAvatarPreview()">
          <input type="url"  id="avatarUrl"   placeholder="URL foto profil (opsional)" oninput="updateAvatarPreview()">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Status</label>
          <input type="text" id="contactStatus" value="online">
        </div>
        <div class="field">
          <label>Warna Avatar</label>
          <input type="color" id="avatarColor" value="#00a884" style="height:40px; padding:4px 6px; cursor:pointer">
        </div>
      </div>
    </div>

    <!-- Message -->
    <div class="section">
      <div class="section-title">💬 Pesan</div>
      <div class="field">
        <label>Teks Pesan</label>
        <textarea id="message" placeholder="Ketik pesan...">Luka di motor lebih cepat sembuh dari pada luka di hati</textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Waktu</label>
          <input type="text" id="messageTime" value="08.08" maxlength="8">
        </div>
        <div class="field">
          <label>Jam Status Bar</label>
          <input type="text" id="statusTime" value="08.25" maxlength="8">
        </div>
      </div>
      <div class="field">
        <label>Jenis Pesan</label>
        <select id="senderType">
          <option value="received">Diterima (kiri, abu-abu)</option>
          <option value="sent">Dikirim (kanan, hijau)</option>
        </select>
      </div>
      <div class="field">
        <label>Sponsor / Footer (opsional)</label>
        <textarea id="sponsored" placeholder="Disponsori:&#10;@username1&#10;@username2" style="min-height:56px"></textarea>
      </div>
    </div>

    <!-- Reactions -->
    <div class="section">
      <div class="section-title">😀 Reactions</div>
      <div class="field">
        <label>Emoji (pisahkan spasi, max 6)</label>
        <input type="text" class="re-input" id="reactions" value="👍 ❤️ 😂 😮 😢 🙏">
      </div>
    </div>

    <!-- Menu items -->
    <div class="section">
      <div class="section-title">📋 Context Menu</div>
      <div class="menu-list" id="menuList"></div>
      <button class="btn-add-item" onclick="addMenuItem()">+ Tambah item</button>
      <div class="toggle-row">
        <span class="toggle-label">Tampilkan tombol Hapus (merah)</span>
        <div class="toggle on" id="deleteToggle" onclick="toggleDelete()">
          <div class="toggle-knob"></div>
        </div>
      </div>
    </div>

    <!-- Generate -->
    <button class="btn-generate" id="genBtn" onclick="generate()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Generate Screenshot
    </button>

  </div>

  <!-- ── Preview ── -->
  <div class="preview-panel" id="previewPanel">
    <div class="preview-box" id="previewBox">
      <div class="preview-placeholder" id="placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <p>Screenshot akan muncul di sini</p>
      </div>
      <img class="preview-img" id="previewImg" style="display:none" alt="WA screenshot">
      <div class="loading" id="loading"><div class="spinner"></div></div>
    </div>
    <div class="preview-actions" id="previewActions" style="display:none">
      <button class="btn-dl btn-dl-png" onclick="downloadPng()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download PNG
      </button>
      <button class="btn-dl btn-dl-copy" onclick="copyImg()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy
      </button>
    </div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────────
let currentMode   = 'iphone';
let showDelete    = true;
let currentBlob   = null;
let menuItems     = [
  { label: 'Beri Bintang', icon: 'star'    },
  { label: 'Balas',        icon: 'reply'   },
  { label: 'Teruskan',     icon: 'forward' },
  { label: 'Salin',        icon: 'copy'    },
  { label: 'Sematkan',     icon: 'pin'     },
  { label: 'Laporkan',     icon: 'report'  },
];

const ICON_OPTIONS = ['star','reply','forward','copy','pin','report','trash'];

// ── Mode ───────────────────────────────────────────────────────────────────────
function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  // Android has no icon column
  renderMenuList();
}

// ── Avatar preview ─────────────────────────────────────────────────────────────
function updateAvatarPreview() {
  const name    = document.getElementById('contactName').value.trim();
  const url     = document.getElementById('avatarUrl').value.trim();
  const color   = document.getElementById('avatarColor').value;
  const preview = document.getElementById('avatarPreview');
  const initEl  = document.getElementById('avatarInitialDisplay');
  const imgEl   = document.getElementById('avatarImgEl');

  preview.style.background = color;
  initEl.textContent = name ? name[0].toUpperCase() : '?';

  if (url) {
    imgEl.src = url;
    imgEl.style.display = 'block';
    initEl.style.display = 'none';
  } else {
    imgEl.style.display = 'none';
    initEl.style.display = '';
  }
}

// ── Menu list ──────────────────────────────────────────────────────────────────
function renderMenuList() {
  const list    = document.getElementById('menuList');
  const isPhone = currentMode === 'iphone';
  list.innerHTML = menuItems.map((item, i) => `
    <div class="menu-item-row">
      <input type="text" value="${escHtml(item.label)}" placeholder="Label menu"
        oninput="menuItems[${i}].label = this.value">
      ${isPhone ? `
        <select class="icon-select" onchange="menuItems[${i}].icon = this.value">
          ${ICON_OPTIONS.map(ic => `<option value="${ic}" ${item.icon===ic?'selected':''}>${ic}</option>`).join('')}
        </select>` : `<div></div>`}
      <button class="btn-remove" onclick="removeMenuItem(${i})" title="Hapus">✕</button>
    </div>`).join('');
}

function addMenuItem() {
  menuItems.push({ label: 'Menu Baru', icon: 'copy' });
  renderMenuList();
}

function removeMenuItem(i) {
  menuItems.splice(i, 1);
  renderMenuList();
}

function toggleDelete() {
  showDelete = !showDelete;
  const t = document.getElementById('deleteToggle');
  t.classList.toggle('on', showDelete);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Generate ───────────────────────────────────────────────────────────────────
async function generate() {
  const btn = document.getElementById('genBtn');
  const loading = document.getElementById('loading');
  const errEl   = document.getElementById('errorMsg');
  const img     = document.getElementById('previewImg');
  const ph      = document.getElementById('placeholder');
  const actions = document.getElementById('previewActions');

  btn.disabled = true;
  loading.classList.add('show');
  errEl.classList.remove('show');

  const reactionsRaw = document.getElementById('reactions').value;
  // Split emoji properly
  const reactions = [...reactionsRaw.matchAll(/\p{Emoji_Presentation}|\p{Extended_Pictographic}/gu)].map(m => m[0]).slice(0, 6);

  const payload = {
    mode:          currentMode,
    contactName:   document.getElementById('contactName').value,
    contactStatus: document.getElementById('contactStatus').value,
    avatarUrl:     document.getElementById('avatarUrl').value,
    avatarInitial: (document.getElementById('contactName').value.trim()[0] || '?').toUpperCase(),
    avatarColor:   document.getElementById('avatarColor').value,
    message:       document.getElementById('message').value,
    messageTime:   document.getElementById('messageTime').value,
    statusTime:    document.getElementById('statusTime').value,
    senderType:    document.getElementById('senderType').value,
    sponsored:     document.getElementById('sponsored').value,
    reactions:     reactions.length ? reactions : ['👍','❤️','😂','😮','😢','🙏'],
    menuItems,
    showDelete,
    scale:         2,
  };

  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: res.statusText }));
      throw new Error(err.error || 'Server error');
    }

    const blob = await res.blob();
    currentBlob = blob;
    const url   = URL.createObjectURL(blob);

    img.src = url;
    img.style.display = 'block';
    ph.style.display  = 'none';
    actions.style.display = 'flex';

  } catch (err) {
    errEl.textContent = '❌ ' + err.message;
    errEl.classList.add('show');
  } finally {
    btn.disabled = false;
    loading.classList.remove('show');
  }
}

// ── Download & Copy ────────────────────────────────────────────────────────────
function downloadPng() {
  if (!currentBlob) return;
  const a  = document.createElement('a');
  a.href   = URL.createObjectURL(currentBlob);
  a.download = `wa-${Date.now()}.png`;
  a.click();
}

async function copyImg() {
  if (!currentBlob) return;
  try {
    await navigator.clipboard.write([
      new ClipboardItem({ 'image/png': currentBlob })
    ]);
    const btn = event.currentTarget;
    const orig = btn.innerHTML;
    btn.textContent = '✓ Copied!';
    setTimeout(() => btn.innerHTML = orig, 1500);
  } catch {
    alert('Copy tidak didukung browser ini. Download aja ya.');
  }
}

// ── Init ───────────────────────────────────────────────────────────────────────
renderMenuList();
updateAvatarPreview();
</script>

</body>
</html>
